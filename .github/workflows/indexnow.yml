# После каждой публикации сайта сообщает Яндексу и Bing (протокол IndexNow), какие страницы обновились.
name: indexnow
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Подождать, пока GitHub Pages опубликует сайт
        run: sleep 90
      - name: Отправить список страниц
        run: |
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#</\?loc>##g' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          BODY="{\"host\":\"toimanager.app\",\"key\":\"6c954c0052088e49cab9c050501bf65c\",\"keyLocation\":\"https://toimanager.app/6c954c0052088e49cab9c050501bf65c.txt\",\"urlList\":$URLS}"
          for ep in https://api.indexnow.org/indexnow https://yandex.com/indexnow; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$ep" -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
            echo "$ep → $code"
          done
